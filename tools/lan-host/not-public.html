<!doctype html>
<!--
  NOT OPEN TO EVERYONE YET: what the demo's "Start your own family" shows
  somebody who has no way to the real app - a visitor from the internet,
  through Tailscale Funnel, which opens the demo alone (README.md, "Anybody
  with the link"), or a host that serves the demo with nothing beside it.
  Served at /real by static-server.mjs; a page of its own, so the host needs
  no build of the app to say it. It reads the app's own choices from this
  origin - its language and its light or dark - so it reads as the app.
-->
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FamStory</title>
<style>
  /* apps/mobile/src/theme/tokens.ts: Paper, card, Ink, the reading grey, Evergreen. */
  :root {
    --ground: #F4F1EA;
    --text: #17160F;
    --muted: #6E6A61;
    --primary: #234E42;
    --on-primary: #F4F1EA;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #16150E;
      --text: #F4F1EA;
      --muted: #A8A296;
      --primary: #3DBB8C;
      --on-primary: #0F1A15;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #16150E;
    --text: #F4F1EA;
    --muted: #A8A296;
    --primary: #3DBB8C;
    --on-primary: #0F1A15;
    color-scheme: dark;
  }
  html, body { margin: 0; background: var(--ground); color: var(--text); }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    padding: 32px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 400px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 {
    margin: 20px 0 12px;
    font: 600 26px/1.25 Georgia, "Times New Roman", serif;
  }
  p { margin: 0 0 12px; color: var(--muted); }
  a {
    display: inline-block;
    margin-top: 16px;
    padding: 14px 24px;
    border-radius: 14px;
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 600;
    text-decoration: none;
  }
  a:focus-visible { outline: 3px solid var(--muted); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1 id="title">Īstā FamStory vēl nav atvērta visiem</h1>
  <p id="body">Šeit ir demo ar parauga ģimeni — izmēģini visu, kas tajā ir. Nekas, ko tajā izveido, netiek saglabāts.</p>
  <p id="ask">Ja gribi savu ģimeni īstajā lietotnē, pajautā tam, kurš tev iedeva šo saiti.</p>
  <a id="back" href="/">← Atpakaļ uz demo</a>
</main>
<script>
  (function () {
    var TEXT = {
      lv: {
        title: 'Īstā FamStory vēl nav atvērta visiem',
        body: 'Šeit ir demo ar parauga ģimeni — izmēģini visu, kas tajā ir. Nekas, ko tajā izveido, netiek saglabāts.',
        ask: 'Ja gribi savu ģimeni īstajā lietotnē, pajautā tam, kurš tev iedeva šo saiti.',
        back: '← Atpakaļ uz demo',
      },
      en: {
        title: 'The real FamStory is not open to everyone yet',
        body: 'This is the demo, with a sample family - try everything in it. Nothing you make in it is kept.',
        ask: 'For your own family in the real app, ask whoever gave you this link.',
        back: '← Back to the demo',
      },
    };
    function stored(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || 'null');
      } catch (e) {
        return null;
      }
    }
    // The app keeps these in this origin (data/locale.ts, data/appearance.ts).
    var locale = (stored('famstory.locale') || {}).locale;
    if (locale !== 'lv' && locale !== 'en') locale = /^lv\b/i.test(navigator.language || '') ? 'lv' : 'en';
    var preference = (stored('famstory.appearance') || {}).preference;
    if (preference === 'light' || preference === 'dark') document.documentElement.setAttribute('data-theme', preference);

    var words = TEXT[locale];
    document.documentElement.lang = locale;
    ['title', 'body', 'ask', 'back'].forEach(function (id) {
      document.getElementById(id).textContent = words[id];
    });

    // Back to the screen the button was pressed on, when that was this demo;
    // from anywhere else, to the demo's front.
    document.getElementById('back').addEventListener('click', function (event) {
      try {
        if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
          event.preventDefault();
          history.back();
        }
      } catch (e) {
        // A referrer that is not a URL: the link itself.
      }
    });
  })();
</script>
</body>
</html>
