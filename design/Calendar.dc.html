<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B65A2E; text-decoration: none; }
    a:hover { color: #8F4522; }
    * { box-sizing: border-box; }
    .day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
    .num { width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .dots { display: flex; gap: 3px; height: 5px; }
    .dot { width: 5px; height: 5px; border-radius: 999px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF7F2; position: relative; overflow: hidden; color: #1F1B16;">

  <div style="padding: 20px 20px 0;">
    <div style="font-family: 'Newsreader', Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 500;">Calendar</div>
  </div>

  <!-- ── The month switcher ────────────────────────────────────── -->
  <div style="display: flex; align-items: center; padding: 18px 12px 0;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B6259" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <div style="flex-grow: 1; text-align: center; font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 500;">Septembris 2026</div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6B6259" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>
  </div>

  <!-- ── Weekday headings ─────────────────────────────────────── -->
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; padding: 10px 12px 0;">
    <div style="text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #B3A99C;">P</div>
    <div style="text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #B3A99C;">O</div>
    <div style="text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #B3A99C;">T</div>
    <div style="text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #B3A99C;">C</div>
    <div style="text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #B3A99C;">P</div>
    <div style="text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #B3A99C;">S</div>
    <div style="text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #B3A99C;">S</div>
  </div>

  <!-- ── The grid ─────────────────────────────────────────────── -->
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; padding: 4px 12px 0;">
    <div class="day"><div class="num" style="color: #CFC6B8;">31</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16; font-weight: 600; background: #E9F0EC;">1</div><div class="dots"><div class="dot" style="background: #3A5F8A;"></div></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">2</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">3</div><div class="dots"><div class="dot" style="background: #6B6259;"></div></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">4</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #9A9086;">5</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #9A9086;">6</div><div class="dots"><div class="dot" style="background: #B8622A;"></div></div></div>

    <div class="day"><div class="num" style="color: #1F1B16;">7</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">8</div><div class="dots"><div class="dot" style="background: #A93A33;"></div><div class="dot" style="background: #6B6259;"></div></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">9</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #FFFFFF; font-weight: 600; background: #2F5D4C;">10</div><div class="dots"><div class="dot" style="background: #A93A33;"></div><div class="dot" style="background: #6B6259;"></div></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">11</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #9A9086;">12</div><div class="dots"><div class="dot" style="background: #3A5F8A;"></div></div></div>
    <div class="day"><div class="num" style="color: #9A9086;">13</div><div class="dots"><div class="dot" style="background: #8A6B1F;"></div></div></div>

    <div class="day"><div class="num" style="color: #1F1B16;">14</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">15</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">16</div><div class="dots"><div class="dot" style="background: #6B6259;"></div></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">17</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">18</div><div class="dots"><div class="dot" style="background: #2E7A82;"></div><div class="dot" style="background: #B8622A;"></div><div class="dot" style="background: #3D7A4E;"></div></div></div>
    <div class="day"><div class="num" style="color: #9A9086;">19</div><div class="dots"><div class="dot" style="background: #2E7A82;"></div></div></div>
    <div class="day"><div class="num" style="color: #9A9086;">20</div><div class="dots"><div class="dot" style="background: #2E7A82;"></div></div></div>

    <div class="day"><div class="num" style="color: #1F1B16;">21</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">22</div><div class="dots"><div class="dot" style="background: #6B6259;"></div></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">23</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">24</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">25</div><div class="dots"><div class="dot" style="background: #7B4A86;"></div></div></div>
    <div class="day"><div class="num" style="color: #9A9086;">26</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #9A9086;">27</div><div class="dots"></div></div>

    <div class="day"><div class="num" style="color: #1F1B16;">28</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">29</div><div class="dots"><div class="dot" style="background: #6B6259;"></div></div></div>
    <div class="day"><div class="num" style="color: #1F1B16;">30</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #CFC6B8;">1</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #CFC6B8;">2</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #CFC6B8;">3</div><div class="dots"></div></div>
    <div class="day"><div class="num" style="color: #CFC6B8;">4</div><div class="dots"></div></div>
  </div>

  <!-- ── Dienas saraksts ────────────────────────────────────── -->
  <div style="padding: 18px 20px 0;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9A9086;">Today</span>
      <div style="flex-grow: 1; height: 1px; background: #E5DED2;"></div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 14px; background: #FFFFFF; border: 1px solid #E5DED2; border-radius: 12px; padding: 13px 14px;">
      <div style="width: 3px; border-radius: 999px; background: #A93A33; align-self: stretch;"></div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 500;">Dentist — Emily</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
          <span style="font-size: 12px; color: #9A9086;">16:00</span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B65A2E" stroke-width="1.8" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19a6.5 6.5 0 0113 0"/><path d="M16 6.2a3.2 3.2 0 010 6"/><path d="M17.5 13.4A6.5 6.5 0 0121.5 19"/></svg>
            <span style="font-size: 12px; color: #B65A2E; font-weight: 500;">Parents</span>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 10px; background: #FFFFFF; border: 1px solid #E5DED2; border-radius: 12px; padding: 13px 14px;">
      <div style="width: 3px; border-radius: 999px; background: #6B6259; align-self: stretch;"></div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 500;">Swimming practice</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
          <span style="font-size: 12px; color: #9A9086;">16:30</span>
          <span style="font-size: 12px; color: #9A9086;">Whole family</span>
        </div>
      </div>
    </div>

    <!-- A conflict: two events overlap -->
    <div style="display: flex; align-items: center; gap: 9px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #F8E7DC;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B65A2E" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0;"><path d="M12 3.5L21.5 20H2.5z"/><path d="M12 10v4M12 17.2v.1"/></svg>
      <span style="font-size: 12px; line-height: 17px; color: #7A3D1B;">These two overlap for Emily</span>
    </div>
  </div>

  <!-- ── Floating button ───────────────────────────────────────── -->
  <div style="position: absolute; right: 20px; bottom: 96px; width: 56px; height: 56px; border-radius: 999px; background: #2F5D4C; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(47,93,76,0.34);">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <!-- ── Tab bar ────────────────────────────────────────── -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); border-top: 1px solid #E5DED2; display: flex; align-items: flex-start; padding-top: 10px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span style="font-size: 11px; color: #9A9086;">Timeline</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F5D4C" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #2F5D4C;">Calendar</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19a6.5 6.5 0 0113 0"/><path d="M16 6.2a3.2 3.2 0 010 6"/><path d="M17.5 13.4A6.5 6.5 0 0121.5 19"/></svg>
      <span style="font-size: 11px; color: #9A9086;">Family</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9086" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.5a6.5 6.5 0 0111.6 0"/></svg>
      <span style="font-size: 11px; color: #9A9086;">Profils</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
