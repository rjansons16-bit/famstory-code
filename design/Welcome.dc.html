<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B65A2E; text-decoration: none; }
    a:hover { color: #8F4522; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #24463A; position: relative; overflow: hidden; color: #F5F1E8;">

  <!-- ── Atmosphere ──────────────────────────────────────────── -->
  <svg width="390" height="500" viewBox="0 0 390 500" style="position: absolute; top: 0; left: 0;">
    <defs>
      <radialGradient id="glow" cx="0.72" cy="0.18" r="0.78">
        <stop offset="0%" stop-color="#3D7361" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#24463A" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="390" height="500" fill="url(#glow)"/>
  </svg>

  <!-- The chronicle motif: linked event dots -->
  <svg width="390" height="330" viewBox="0 0 390 330" style="position: absolute; top: 86px; left: 0; opacity: 0.9;">
    <path d="M62 44 C 150 44, 130 128, 216 128 S 300 232, 336 232" fill="none" stroke="#B65A2E" stroke-width="1.6" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.85"/>
    <circle cx="62" cy="44" r="7" fill="#E8DCCB"/>
    <circle cx="216" cy="128" r="10" fill="#B65A2E"/>
    <circle cx="336" cy="232" r="6" fill="#8FBFA8"/>
    <circle cx="150" cy="212" r="4" fill="#E8DCCB" opacity="0.5"/>
    <circle cx="292" cy="70" r="4" fill="#E8DCCB" opacity="0.4"/>
    <circle cx="96" cy="288" r="5" fill="#8FBFA8" opacity="0.45"/>
  </svg>

  <!-- ── Brand ─────────────────────────────────────────────── -->
  <div style="position: absolute; top: 74px; left: 28px; display: flex; align-items: center; gap: 10px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E8DCCB" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 19px; font-weight: 500; letter-spacing: 0.06em;">FamStory</span>
  </div>

  <!-- ── The promise ───────────────────────────────────────────── -->
  <div style="position: absolute; left: 28px; right: 28px; bottom: 254px;">
    <h1 style="font-family: 'Newsreader', Georgia, serif; font-size: 44px; line-height: 50px; font-weight: 400; letter-spacing: -0.02em; margin: 0; text-wrap: pretty;">A family story<br><em style="font-style: italic; color: #E0A87C;">that lasts</em></h1>
    <p style="font-size: 15px; line-height: 24px; color: rgba(245,241,232,0.72); margin: 18px 0 0; max-width: 300px; text-wrap: pretty;">Events, memories and everyday routine in one place — for your family only.</p>
  </div>

  <!-- ── Actions ───────────────────────────────────────────── -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 96px; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 54px; border-radius: 14px; background: #F5F1E8; color: #24463A; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#24463A"><path d="M21.6 12.2c0-.7-.1-1.3-.2-2H12v3.9h5.4a4.6 4.6 0 01-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0012 22z"/><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 000 9.2z"/><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 003.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"/></svg>
      Continue with Google
    </div>
    <div style="height: 54px; border-radius: 14px; background: rgba(245,241,232,0.1); border: 1px solid rgba(245,241,232,0.22); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#F5F1E8"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.8-3.5.8-.7 0-1.9-.8-3.1-.8-1.6 0-3 .9-3.8 2.4-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7 0 0-2.5-1-2.5-3.7z"/><path d="M14.2 5.9c.6-.8 1-1.9.9-3-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-.9 2.9 1 .1 2-.5 2.7-1.3z"/></svg>
      Continue with Apple
    </div>
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: rgba(245,241,232,0.75);">Continue with email</div>
  </div>

  <!-- ── The privacy promise ─────────────────────────────────── -->
  <div style="position: absolute; left: 28px; right: 28px; bottom: 34px; display: flex; align-items: flex-start; gap: 9px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(245,241,232,0.5)" stroke-width="1.7" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M12 3l7.5 3.4v5.2c0 4.4-3.1 8.3-7.5 9.4-4.4-1.1-7.5-5-7.5-9.4V6.4z"/><path d="M9.3 12.2l1.9 1.9 3.6-3.7"/></svg>
    <span style="font-size: 12px; line-height: 17px; color: rgba(245,241,232,0.5);">Your data is never made public and never used for advertising profiles.</span>
  </div>

</div>
</x-dc>
</body>
</html>
